name: Automation Router

on:
  pull_request:
    paths:
      - "agents/**"
      - "automations/**"
      - "control-plane/**"
      - "controls/**"
      - "governance/**"
      - "execution-surfaces/**"
      - "ARCHITECTURE.md"
      - ".github/workflows/automation-router.yml"

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate automation registry
        run: python automations/validate_registry.py
      - name: Run automation tests
        run: python -m unittest tests.test_automation_layer -v
      - name: Route this pull request
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          mapfile -t files < <(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          args=()
          for file in "${files[@]}"; do
            args+=(--path "$file")
          done
          {
            echo "### Automation route"
            echo
            python automations/route.py \
              --repository "${{ github.repository }}" \
              --event pull_request \
              "${args[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
