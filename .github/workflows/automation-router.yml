name: Automation Router

on:
  pull_request:
    paths:
      - "agents/**"
      - "automations/**"
      - "control-plane/**"
      - "controls/**"
      - "governance/**"
      - "execution-surfaces/**"
      - "orchestration/**"
      - "quality/**"
      - "observability/**"
      - "tests/**"
      - "validation/**"
      - "docs/decisions/**"
      - "docs/orchestration/**"
      - "ARCHITECTURE.md"
      - ".github/workflows/automation-router.yml"

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate automation registry
        run: python automations/validate_registry.py
      - name: Run Factory tests
        run: python -m unittest discover -s tests -v
      - name: Validate browser probe syntax
        run: node --check quality/browser_probe.mjs
      - name: Exercise real-browser visual probe
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory tests/fixtures >/tmp/factory-visual-fixture.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/visual-probe.html >/dev/null; then
              break
            fi
            sleep .25
          done
          node quality/browser_probe.mjs \
            --url http://127.0.0.1:8765/visual-probe.html \
            --output-dir /tmp/factory-visual-qa \
            --manifest /tmp/factory-visual-qa/manifest.json \
            --section 'hero=#hero' \
            --viewport 800x600
          python quality/validate_visual_manifest.py /tmp/factory-visual-qa/manifest.json
      - name: Route this pull request
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          mapfile -t files < <(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          args=()
          for file in "${files[@]}"; do
            args+=(--path "$file")
          done
          {
            echo "### Automation route"
            echo
            python automations/route.py \
              --repository "${{ github.repository }}" \
              --event pull_request \
              "${args[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
