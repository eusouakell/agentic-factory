name: Agent Registry Checks

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "agents/**"
      - "tests/test_agent_registry.py"
      - "governance/first-class-agents.md"
      - "control-plane/run-envelope.schema.json"
      - ".github/workflows/agent-registry.yml"
  push:
    branches:
      - main
    paths:
      - "agents/**"
      - "tests/test_agent_registry.py"
      - ".github/workflows/agent-registry.yml"

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate Registry V3
        run: python agents/validate_registry.py agents/registry.json
      - name: Run registry tests
        run: python -m unittest tests.test_agent_registry -v
